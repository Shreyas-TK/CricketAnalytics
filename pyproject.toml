[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-analytics"
version = "0.1.0"
description = "IPL cricket analytics dashboard with predictive modeling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "streamlit>=1.28.0",
  "matplotlib>=3.7.0",
  "plotly>=5.14.0",
  "scikit-learn>=1.3.0",
  "joblib>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dashboard*"]
