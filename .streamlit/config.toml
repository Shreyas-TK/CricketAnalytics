[theme]
base = "light"
primaryColor = "#14b8a6"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
maxUploadSize = 200
enableXsrfProtection = true
headless = true
port = 8501
address = "0.0.0.0"

[logger]
level = "info"
